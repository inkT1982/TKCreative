<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Creative — Dynamic Studio Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: 'var(--page-bg, #F5F5F7)',
                            darkBg: 'var(--page-dark-bg, #000000)',
                            card: 'var(--card-bg, #FFFFFF)',
                            darkCard: 'var(--card-dark-bg, #1D1D1F)',
                            text: '#1D1D1F',
                            darkText: '#F5F5F7',
                            subtext: '#86868B',
                            darkSubtext: '#A1A1A6',
                            border: 'var(--border-color, #D2D2D7)',
                            darkBorder: 'var(--border-dark-color, #38383A)',
                            accent: 'var(--accent-color, #0071E3)',
                            accentHover: 'var(--accent-hover, #0077ED)'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --accent-color: #0071E3;
            --accent-hover: #0077ED;
            --page-bg: #F5F5F7;
            --page-dark-bg: #000000;
            --card-bg: #FFFFFF;
            --card-dark-bg: #1D1D1F;
            --border-color: #D2D2D7;
            --border-dark-color: #38383A;
            --text-on-accent: #FFFFFF;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-nav { background: rgba(255, 255, 255, 0.82); backdrop-filter: saturate(180px) blur(20px); }
        .dark .glass-nav { background: rgba(0, 0, 0, 0.82); }
        .glass-dock { background: rgba(29, 29, 31, 0.85); backdrop-filter: blur(24px); }
        .editable-active { outline: 2px dashed var(--accent-color) !important; outline-offset: 4px; background: rgba(0, 113, 227, 0.03); cursor: text; }
        .dynamic-accent { color: var(--accent-color); }
        .dynamic-bg { background-color: var(--accent-color); color: var(--text-on-accent); }
        .dynamic-border { border-color: var(--accent-color); }
        .dynamic-card { border-color: var(--border-color); background-color: var(--card-bg); }
        .dark .dynamic-card { border-color: var(--border-dark-color); background-color: var(--card-dark-bg); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[var(--page-bg)] dark:bg-[var(--page-dark-bg)] text-apple-text dark:text-apple-darkText transition-colors duration-300 min-h-screen flex flex-col selection:bg-[var(--accent-color)] selection:text-white">

    <!-- Global Navigation Header -->
    <header class="fixed top-0 left-0 right-0 z-50 h-12 glass-nav border-b border-[var(--border-color)] dark:border-[var(--border-dark-color)] flex items-center justify-between px-6 lg:px-12 text-xs">
        <a href="#/home" class="font-semibold tracking-tight text-sm flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full dynamic-bg"></span> TK Creative
        </a>
        <nav class="hidden md:flex items-center gap-8 font-medium text-apple-subtext dark:text-apple-darkSubtext">
            <a href="#/home" class="hover:text-apple-text dark:hover:text-apple-darkText transition-colors">Overview</a>
            <a href="#/work" class="hover:text-apple-text dark:hover:text-apple-darkText transition-colors">Work</a>
            <a href="#/speexx-annual-kick-off-visual" class="hover:text-apple-text dark:hover:text-apple-darkText transition-colors">Speexx Case Study</a>
            <a href="#/studio" class="hover:text-apple-text dark:hover:text-apple-darkText transition-colors">Studio</a>
            <a href="#/contact" class="hover:text-apple-text dark:hover:text-apple-darkText transition-colors">Contact</a>
        </nav>
        <div class="flex items-center gap-4">
            <button onclick="toggleTheme()" class="p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors" title="Toggle Theme">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
            <button onclick="requestEditMode()" id="editModeIndicator" class="px-3 py-1 rounded-full bg-black/5 dark:bg-white/10 font-medium hover:bg-black/10 dark:hover:bg-white/25 transition-all flex items-center gap-1.5">
                <span id="editDot" class="w-2 h-2 rounded-full bg-apple-subtext"></span>
                <span id="editText">Studio CMS Mode</span>
            </button>
        </div>
    </header>

    <!-- Main Content Root Container -->
    <main id="app" class="flex-grow pt-24 pb-20 px-6 lg:px-12 max-w-7xl mx-auto w-full"></main>

    <!-- Authentication Modal (Secure Guard - No Passcode Exposed) -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-6">
        <div class="bg-apple-card dark:bg-apple-darkCard rounded-3xl p-8 max-w-sm w-full shadow-2xl border border-[var(--border-color)] dark:border-[var(--border-dark-color)]">
            <h3 class="text-lg font-semibold tracking-tight mb-2">Studio Authentication</h3>
            <p class="text-xs text-apple-subtext dark:text-apple-darkSubtext mb-4">Enter your secure passcode to unlock CMS & theme controls.</p>
            <input type="password" id="passcodeInput" placeholder="Enter passcode..." class="w-full p-3 rounded-xl bg-apple-bg dark:bg-black/30 border border-[var(--border-color)] dark:border-[var(--border-dark-color)] text-xs mb-4 focus:outline-none focus:border-[var(--accent-color)]" onkeydown="if(event.key === 'Enter') verifyPasscode()">
            <div id="authError" class="text-red-500 text-[10px] mb-3 hidden">Incorrect passcode.</div>
            <div class="flex justify-end gap-2">
                <button onclick="closeAuthModal()" class="px-4 py-2 bg-black/5 dark:bg-white/10 font-medium rounded-xl text-xs">Cancel</button>
                <button onclick="verifyPasscode()" class="px-4 py-2 dynamic-bg font-medium rounded-xl text-xs">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Floating Studio Dock with Global Theme Customizer & Accessible Dynamic Mode -->
    <div id="studioDock" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden items-center gap-3 px-5 py-3 rounded-2xl glass-dock text-white shadow-2xl border border-white/10 animate-fade-in text-xs">
        <div class="flex items-center gap-2 font-semibold dynamic-accent pr-3 border-r border-white/10">
            <span>Dynamic CMS</span>
        </div>
        <div class="flex items-center gap-2 px-2 border-r border-white/10">
            <label class="text-[10px] text-white/75">Theme Color:</label>
            <input type="color" id="accentPicker" value="#0071E3" onchange="setCustomAccent(this.value, true)" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">
            <label class="flex items-center gap-1.5 cursor-pointer text-[11px] ml-1">
                <input type="checkbox" id="dynamicModeToggle" onchange="toggleDynamicMode(this.checked)" class="rounded"> Accessible Dynamic Visual Mode
            </label>
        </div>
        <button onclick="addBlockPrompt()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg transition-colors font-medium">＋ Block</button>
        <button onclick="openSiteMap()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded-lg transition-colors font-medium">🗺️ Pages</button>
        <button onclick="exportHTML()" class="px-3 py-1.5 dynamic-bg rounded-lg transition-colors font-medium">📥 Export</button>
        <button onclick="requestEditMode()" class="p-1.5 hover:bg-white/20 rounded-lg text-white/60 hover:text-white transition-colors">🔒 Lock</button>
    </div>

    <!-- Block Inspector Drawer -->
    <div id="inspectorDrawer" class="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-apple-card dark:bg-apple-darkCard shadow-2xl border-l border-[var(--border-color)] dark:border-[var(--border-dark-color)] p-8 transform translate-x-full transition-transform duration-300 overflow-y-auto">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-[var(--border-color)] dark:border-[var(--border-dark-color)]">
            <h3 class="text-lg font-semibold tracking-tight">Block Configuration</h3>
            <button onclick="closeInspector()" class="text-lg">✕</button>
        </div>
        <div id="inspectorContent" class="space-y-6 text-xs"></div>
        <div class="pt-6 mt-6 border-t border-[var(--border-color)] dark:border-[var(--border-dark-color)] flex justify-end gap-3">
            <button onclick="closeInspector()" class="px-4 py-2 bg-black/5 dark:bg-white/10 font-medium rounded-xl">Cancel</button>
            <button onclick="saveInspectorChanges()" class="px-4 py-2 dynamic-bg font-medium rounded-xl">Save</button>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-6" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Zoomed" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl">
    </div>

    <!-- Site Map Modal -->
    <div id="siteMapModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-6">
        <div class="bg-apple-card dark:bg-apple-darkCard rounded-3xl p-8 max-w-2xl w-full shadow-2xl border border-[var(--border-color)] dark:border-[var(--border-dark-color)] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold tracking-tight">Studio Pages</h3>
                <button onclick="closeSiteMap()">✕</button>
            </div>
            <div id="siteMapList" class="space-y-3 mb-6"></div>
            <button onclick="createNewPagePrompt()" class="px-4 py-2 dynamic-bg font-medium rounded-xl text-xs">＋ Create New Page</button>
        </div>
    </div>

    <!-- Core Accessible Dynamic Theme & CMS Engine -->
    <script>
        let isEditMode = false;
        let activeInspector = { pageKey: null, blockIndex: null };
        const STUDIO_PASSCODE = 'tkcreative';

        // Load saved theme preferences
        let currentAccent = localStorage.getItem('tk_accent') || '#0071E3';
        let isDynamicMode = localStorage.getItem('tk_dynamic_mode') === 'true';
        applyThemeColors(currentAccent);
        document.getElementById('accentPicker').value = currentAccent;
        document.getElementById('dynamicModeToggle').checked = isDynamicMode;

        const defaultPages = {
            'home': {
                title: "TK Creative Studio",
                subtitle: "Editorial brand systems and visual design practice.",
                blocks: [
                    {
                        type: 'hero',
                        tag: 'Selected Studio Work',
                        heading: 'Playfulness through elegance and rhythm.',
                        body: 'Specialized in brand systems, digital experiences, and editorial storytelling.',
                        ctaText: 'Explore Speexx Case Study',
                        ctaLink: '#/speexx-annual-kick-off-visual'
                    },
                    {
                        type: 'side_by_side_showcase',
                        heading: 'Featured Project Visuals',
                        subheading: 'Editorial Layout',
                        cards: [
                            {
                                title: 'Speexx Annual Kick-off Visual',
                                category: 'Event Branding & Visual System',
                                desc: 'Alps and Mallorca brand system abstraction combining soft gradients and geometric precision.',
                                link: '#/speexx-annual-kick-off-visual',
                                badge: 'Featured 2025',
                                image: 'https://imgproxy.gamma.app/resize/quality:80/resizing_type:fit/width:2000/https://cdn.gamma.app/k2xy4zz7vjv6af1/f9c12609b4784a7a9973e2de6fce4a36/original/Speexx-Mallorca3.png'
                            }
                        ]
                    }
                ]
            },
            'speexx-annual-kick-off-visual': {
                title: "Speexx Annual Kick-off Visual",
                subtitle: "Event branding journey in Mallorca and the Alps.",
                blocks: [
                    {
                        type: 'editorial_header',
                        client: 'Speexx',
                        discipline: 'Event Branding',
                        year: '2025',
                        title: 'Playfulness through elegance and rhythm',
                        summary: 'A well organised event boosts employee engagement and contribution.'
                    },
                    {
                        type: 'split_feature',
                        title: 'Simple, simple, simple',
                        body: 'The visual system abstracts land (Alps) and sea (Mallorca) into clean geometric languages.',
                        image: 'https://imgproxy.gamma.app/resize/quality:80/resizing_type:fit/width:2000/https://cdn.gamma.app/k2xy4zz7vjv6af1/f9c12609b4784a7a9973e2de6fce4a36/original/Speexx-Mallorca3.png'
                    }
                ]
            }
        };

        let pages = JSON.parse(localStorage.getItem('tk_dynamic_pages') || JSON.stringify(defaultPages));
        let currentTheme = localStorage.getItem('tk_theme') || 'light';
        if (currentTheme === 'dark') document.documentElement.classList.add('dark');

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('tk_theme', isDark ? 'dark' : 'light');
        }

        // Accessibility & Global Theme Color Application Engine
        function applyThemeColors(hex, save = false) {
            currentAccent = hex;
            const rgb = hexToRgb(hex);
            const luminance = getLuminance(rgb.r, rgb.g, rgb.b);

            // Ensure contrast ratio for accessibility (WCAG compliant text color on accent)
            const textOnAccent = luminance > 0.5 ? '#1D1D1F' : '#FFFFFF';

            // Apply global page variables (backgrounds, boxes, borders, and accents)
            document.documentElement.style.setProperty('--accent-color', hex);
            document.documentElement.style.setProperty('--text-on-accent', textOnAccent);
            document.documentElement.style.setProperty('--page-bg', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.035)`);
            document.documentElement.style.setProperty('--border-color', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.2)`);
            document.documentElement.style.setProperty('--border-dark-color', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.3)`);

            if (save) {
                localStorage.setItem('tk_accent', hex);
            }
        }

        function hexToRgb(hex) {
            let bigint = parseInt(hex.replace('#',''), 16);
            return {
                r: (bigint >> 16) & 255,
                g: (bigint >> 8) & 255,
                b: bigint & 255
            };
        }

        function getLuminance(r, g, b) {
            let a = [r, g, b].map(v => {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }

        function setCustomAccent(color) {
            applyThemeColors(color, true);
        }

        function toggleDynamicMode(enabled) {
            isDynamicMode = enabled;
            localStorage.setItem('tk_dynamic_mode', enabled);
            if (enabled) extractPageDominantColor();
        }

        // Extract Dominant Color from First Image on Page (Accessible Dynamic Mode)
        function extractPageDominantColor() {
            if (!isDynamicMode) return;
            const firstImg = document.querySelector('main img');
            if (!firstImg) return;

            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = firstImg.src;
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 1;
                    canvas.height = 1;
                    ctx.drawImage(img, 0, 0, 1, 1);
                    const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
                    const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
                    applyThemeColors(hex, false);
                    document.getElementById('accentPicker').value = hex;
                } catch(e) {
                    // CORS fallback safely handled
                }
            };
        }

        function router() {
            const hash = window.location.hash.slice(2) || 'home';
            const pageData = pages[hash] || pages['home'];
            document.title = pageData.title;
            document.getElementById('app').innerHTML = renderPage(pageData, hash);
            if (isEditMode) enableEditing();
            if (isDynamicMode) setTimeout(extractPageDominantColor, 300);
            window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);

        function renderPage(pageData, pageKey) {
            let html = `
                <div class="mb-12 animate-fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs uppercase tracking-widest text-apple-subtext font-semibold">TK Creative Studio</span>
                        ${isEditMode ? `<button onclick="deletePage('${pageKey}')" class="text-xs text-red-500 hover:underline">Delete Page</button>` : ''}
                    </div>
                    <h1 class="text-3xl lg:text-5xl font-bold tracking-tight mb-3" contenteditable="${isEditMode}" onblur="updatePageProp('${pageKey}', 'title', this.innerText)">${pageData.title}</h1>
                    <p class="text-lg text-apple-subtext max-w-2xl" contenteditable="${isEditMode}" onblur="updatePageProp('${pageKey}', 'subtitle', this.innerText)">${pageData.subtitle}</p>
                </div>
                <div class="space-y-16">
            `;

            pageData.blocks.forEach((block, blockIndex) => {
                html += `<div class="relative group">`;
                if (isEditMode) {
                    html += `
                        <div class="absolute -top-4 right-0 z-20 hidden group-hover:flex items-center gap-1.5 dynamic-bg px-3 py-1 rounded-md text-[10px] shadow-lg">
                            <button onclick="openInspector('${pageKey}', ${blockIndex})" class="underline font-medium">⚙️ Configure Block</button>
                            <button onclick="moveBlock('${pageKey}', ${blockIndex}, -1)">▲</button>
                            <button onclick="moveBlock('${pageKey}', ${blockIndex}, 1)">▼</button>
                            <button onclick="deleteBlock('${pageKey}', ${blockIndex})" class="ml-1 text-white/85">✕</button>
                        </div>
                    `;
                }

                if (block.type === 'hero') {
                    html += `
                        <div class="p-8 lg:p-14 rounded-3xl dynamic-card border shadow-sm">
                            <span class="text-xs uppercase tracking-widest dynamic-accent font-semibold mb-3 block">${block.tag}</span>
                            <h2 class="text-2xl lg:text-4xl font-semibold tracking-tight mb-4">${block.heading}</h2>
                            <p class="text-base lg:text-lg text-apple-subtext mb-8 max-w-2xl">${block.body}</p>
                            <a href="${block.ctaLink}" class="px-6 py-3 dynamic-bg hover:opacity-90 rounded-xl font-medium text-sm transition-opacity">${block.ctaText}</a>
                        </div>
                    `;
                } else if (block.type === 'side_by_side_showcase') {
                    html += `
                        <div class="space-y-8">
                            <h2 class="text-2xl lg:text-3xl font-semibold tracking-tight">${block.heading}</h2>
                    `;
                    block.cards.forEach(card => {
                        html += `
                            <div class="p-8 lg:p-12 rounded-3xl dynamic-card border shadow-sm grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                                <div class="lg:col-span-5 space-y-4">
                                    <span class="text-xs uppercase tracking-wider dynamic-accent font-semibold">${card.category}</span>
                                    <h3 class="text-2xl font-semibold tracking-tight">${card.title}</h3>
                                    <p class="text-sm text-apple-subtext leading-relaxed">${card.desc}</p>
                                    <a href="${card.link}" class="inline-flex items-center gap-2 text-sm font-medium dynamic-accent hover:underline">Explore Case Study →</a>
                                </div>
                                <div class="lg:col-span-7 rounded-2xl overflow-hidden aspect-[16/10] bg-apple-bg dark:bg-black/40 border border-[var(--border-color)] cursor-pointer shadow-md" onclick="openLightbox('${card.image}')">
                                    <img src="${card.image}" alt="${card.title}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else if (block.type === 'editorial_header') {
                    html += `
                        <div class="max-w-4xl mx-auto py-8">
                            <div class="text-xs font-semibold uppercase tracking-widest text-apple-subtext mb-4">Client: ${block.client} • ${block.discipline} • ${block.year}</div>
                            <h2 class="text-3xl lg:text-5xl font-bold tracking-tight mb-6">${block.title}</h2>
                            <p class="text-xl text-apple-subtext leading-relaxed">${block.summary}</p>
                        </div>
                    `;
                } else if (block.type === 'split_feature') {
                    html += `
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center py-6">
                            <div>
                                <h3 class="text-2xl font-semibold tracking-tight mb-4">${block.title}</h3>
                                <p class="text-base text-apple-subtext leading-relaxed">${block.body}</p>
                            </div>
                            <div class="rounded-3xl overflow-hidden dynamic-card border cursor-pointer shadow-md" onclick="openLightbox('${block.image}')">
                                <img src="${block.image}" alt="${block.title}" class="w-full h-auto object-cover">
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            html += `</div>`;
            return html;
        }

        // Auth & CMS Control
        function requestEditMode() {
            if (isEditMode) { toggleEditMode(false); } 
            else {
                document.getElementById('passcodeInput').value = '';
                document.getElementById('authError').classList.add('hidden');
                const modal = document.getElementById('authModal');
                modal.classList.remove('hidden'); modal.classList.add('flex');
            }
        }

        function closeAuthModal() { document.getElementById('authModal').classList.remove('flex'); document.getElementById('authModal').classList.add('hidden'); }

        function verifyPasscode() {
            if (document.getElementById('passcodeInput').value === STUDIO_PASSCODE) {
                closeAuthModal(); toggleEditMode(true);
            } else { document.getElementById('authError').classList.remove('hidden'); }
        }

        function toggleEditMode(force) {
            isEditMode = force !== undefined ? force : !isEditMode;
            document.getElementById('studioDock').classList.toggle('flex', isEditMode);
            document.getElementById('studioDock').classList.toggle('hidden', !isEditMode);
            router();
        }

        function openInspector(pageKey, blockIndex) {
            activeInspector = { pageKey, blockIndex };
            const block = pages[pageKey].blocks[blockIndex];
            document.getElementById('inspectorContent').innerHTML = `
                <div>
                    <label class="block font-semibold mb-1">Block Type</label>
                    <select id="inspType" class="w-full p-3 rounded-xl bg-apple-bg dark:bg-black/30 border border-[var(--border-color)]">
                        <option value="hero" ${block.type==='hero'?'selected':''}>Hero Banner</option>
                        <option value="side_by_side_showcase" ${block.type==='side_by_side_showcase'?'selected':''}>Side-by-Side Showcase</option>
                        <option value="editorial_header" ${block.type==='editorial_header'?'selected':''}>Editorial Header</option>
                        <option value="split_feature" ${block.type==='split_feature'?'selected':''}>Split Feature</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">Heading / Title</label>
                    <input type="text" id="inspHeading" value="${block.heading || block.title || ''}" class="w-full p-3 rounded-xl bg-apple-bg dark:bg-black/30 border border-[var(--border-color)]">
                </div>
            `;
            document.getElementById('inspectorDrawer').classList.remove('translate-x-full');
        }

        function closeInspector() { document.getElementById('inspectorDrawer').classList.add('translate-x-full'); }

        function saveInspectorChanges() {
            const { pageKey, blockIndex } = activeInspector;
            pages[pageKey].blocks[blockIndex].type = document.getElementById('inspType').value;
            const val = document.getElementById('inspHeading').value;
            if (pages[pageKey].blocks[blockIndex].heading) pages[pageKey].blocks[blockIndex].heading = val;
            if (pages[pageKey].blocks[blockIndex].title) pages[pageKey].blocks[blockIndex].title = val;
            savePages(); closeInspector(); router();
        }

        function openLightbox(url) { document.getElementById('lightboxImg').src = url; document.getElementById('lightboxModal').classList.remove('hidden'); document.getElementById('lightboxModal').classList.add('flex'); }
        function closeLightbox() { document.getElementById('lightboxModal').classList.remove('flex'); document.getElementById('lightboxModal').classList.add('hidden'); }
        function savePages() { localStorage.setItem('tk_dynamic_pages', JSON.stringify(pages)); }
        function moveBlock(pk, i, dir) { const b = pages[pk].blocks; const ni = i + dir; if(ni>=0 && ni<b.length){ const t = b[i]; b[i] = b[ni]; b[ni] = t; savePages(); router(); } }
        function deleteBlock(pk, i) { if(confirm('Delete block?')) { pages[pk].blocks.splice(i, 1); savePages(); router(); } }
        function addBlockPrompt() {
            const hash = window.location.hash.slice(2) || 'home';
            pages[hash].blocks.push({ type: 'split_feature', title: 'New Feature Block', body: 'Add narrative text here...', image: 'https://imgproxy.gamma.app/resize/quality:80/resizing_type:fit/width:2000/https://cdn.gamma.app/k2xy4zz7vjv6af1/f9c12609b4784a7a9973e2de6fce4a36/original/Speexx-Mallorca3.png' });
            savePages(); router();
        }
        function openSiteMap() {
            const list = document.getElementById('siteMapList'); list.innerHTML = '';
            Object.keys(pages).forEach(k => { list.innerHTML += `<div class="p-3 bg-apple-bg dark:bg-black/20 rounded-xl flex justify-between items-center text-xs"><span>#/${k}</span><a href="#/${k}" onclick="closeSiteMap()" class="dynamic-accent">Visit</a></div>`; });
            document.getElementById('siteMapModal').classList.remove('hidden'); document.getElementById('siteMapModal').classList.add('flex');
        }
        function closeSiteMap() { document.getElementById('siteMapModal').classList.remove('flex'); document.getElementById('siteMapModal').classList.add('hidden'); }
        function createNewPagePrompt() {
            const slug = prompt("Enter subpage slug (e.g. 'case-study-two'):");
            if(!slug) return;
            const cs = slug.toLowerCase().replace(/[^a-z0-9-]/g, '-');
            pages[cs] = { title: "New Project", subtitle: "Studio overview", blocks: [{ type: 'editorial_header', client: 'Client', discipline: 'Design', year: '2026', title: 'New Case Study', summary: 'Summary...' }] };
            savePages(); openSiteMap();
        }
        function deletePage(pk) {
            if(pk==='home') { alert("Cannot delete homepage."); return; }
            if(confirm("Delete page?")) { delete pages[pk]; savePages(); window.location.hash='#/home'; router(); }
        }
        function exportHTML() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a');
            a.href = url; a.download = 'index.html'; a.click(); URL.revokeObjectURL(url);
        }
        function enableEditing() {
            document.querySelectorAll('h1, h2, h3, p').forEach(el => {
                if(!el.closest('header')) { el.setAttribute('contenteditable', 'true'); el.classList.add('editable-active'); }
            });
        }
    </script>
</body>
</html>
