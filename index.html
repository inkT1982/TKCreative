        // Initialize Theme
        if (currentTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('tk_creative_theme', isDark ? 'dark' : 'light');
        }

        // Router
        function router() {
            const hash = window.location.hash.slice(2) || 'home';
            const pageData = pages[hash] || pages['home'];
            
            document.title = pageData.title;
            const app = document.getElementById('app');
            app.innerHTML = renderPage(pageData, hash);
            
            if (isEditMode) {
                enableEditing();
            }
            window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);

        // Render Page Layout from Blocks
        function renderPage(pageData, pageKey) {
            let html = `
                <div class="mb-12 animate-fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs uppercase tracking-widest text-apple-subtext dark:text-apple-darkSubtext font-semibold">TK Creative Studio</span>

                    </div>
                    <h1 class="text-3xl lg:text-5xl font-bold tracking-tight mb-3" contenteditable="${isEditMode}" onblur="updatePageProp('${pageKey}', 'title', this.innerText)">${pageData.title}</h1>
                    <p class="text-lg text-apple-subtext dark:text-apple-darkSubtext max-w-2xl font-normal" contenteditable="${isEditMode}" onblur="updatePageProp('${pageKey}', 'subtitle', this.innerText)">${pageData.subtitle}</p>
                </div>
                <div class="space-y-16">
            `;

                html += `<div class="relative group">`;

                            <button onclick="moveBlock('${pageKey}', ${blockIndex}, -1)">▲</button>
                            <button onclick="moveBlock('${pageKey}', ${blockIndex}, 1)">▼</button>
                            <button onclick="deleteBlock('${pageKey}', ${blockIndex})" class="ml-1 text-white/80 hover:text-white">✕ Remove</button>
                        </div>
                    `;
                }

                if (block.type === 'hero') {
                    html += `
                        <div class="p-8 lg:p-14 rounded-3xl bg-white dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder shadow-sm">
                            <span class="text-xs uppercase tracking-widest text-apple-accent font-semibold mb-3 block" contenteditable="${isEditMode}" onblur="updateBlockProp('${pageKey}', ${blockIndex}, 'tag', this.innerText)">${block.tag}</span>
                            <h2 class="text-2xl lg:text-4xl font-semibold tracking-tight mb-4 max-w-3xl" contenteditable="${isEditMode}" onblur="updateBlockProp('${pageKey}', ${blockIndex}, 'heading', this.innerText)">${block.heading}</h2>
                            <p class="text-base lg:text-lg text-apple-subtext dark:text-apple-darkSubtext mb-8 max-w-2xl" contenteditable="${isEditMode}" onblur="updateBlockProp('${pageKey}', ${blockIndex}, 'body', this.innerText)">${block.body}</p>
                            <div class="flex items-center gap-4">
                                <a href="${block.ctaLink}" class="px-6 py-3 bg-apple-accent hover:bg-apple-accentHover text-white rounded-xl font-medium text-sm transition-all shadow-sm">${block.ctaText}</a>
                                ${isEditMode ? `<button onclick="editLinkPrompt('${pageKey}', ${blockIndex}, 'ctaLink')" class="text-xs text-apple-accent underline">🔗 Link Page</button>` : ''}
                            </div>
                        </div>
                    `;
                } else if (block.type === 'bento') {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
                    block.cards.forEach((card, cardIndex) => {
                        html += `
                            <div class="p-8 rounded-3xl bg-white dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder shadow-sm flex flex-col justify-between hover:scale-[1.01] transition-transform duration-300">
                                <div>
                                    <div class="flex justify-between items-center mb-4">
                                        <span class="text-xs uppercase tracking-wider text-apple-accent font-semibold">${card.category}</span>
                                        <span class="text-[11px] px-2.5 py-1 rounded-full bg-apple-bg dark:bg-black/40 text-apple-subtext">${card.badge}</span>
                                    </div>
                                    <h3 class="text-xl font-semibold tracking-tight mb-2">${card.title}</h3>
                                    <p class="text-sm text-apple-subtext dark:text-apple-darkSubtext mb-6">${card.desc}</p>
                                </div>
                                <div>
                                    ${card.image ? `<div class="rounded-2xl overflow-hidden mb-6 aspect-video bg-apple-bg dark:bg-black/50 border border-apple-border dark:border-apple-darkBorder cursor-pointer" onclick="openLightbox('${card.image}')"><img src="${card.image}" alt="${card.title}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500"></div>` : ''}
                                    <div class="flex items-center justify-between pt-4 border-t border-apple-border dark:border-apple-darkBorder">
                                        <a href="${card.link}" class="text-sm font-medium text-apple-accent hover:underline flex items-center gap-1">View Case Study →</a>
                                        ${isEditMode ? `<button onclick="editCardLinkPrompt('${pageKey}', ${blockIndex}, ${cardIndex})" class="text-xs text-apple-accent underline">🔗 Link Page</button>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else if (block.type === 'editorial_header') {
                    html += `
                        <div class="max-w-4xl mx-auto py-8">
                            <div class="flex flex-wrap gap-3 items-center text-xs font-semibold uppercase tracking-widest text-apple-subtext dark:text-apple-darkSubtext mb-4">
                                <span>Client: ${block.client}</span>
                                <span>•</span>
                                <span>${block.discipline}</span>
                                <span>•</span>
                                <span>${block.year}</span>
                            </div>
                            <h2 class="text-3xl lg:text-5xl font-bold tracking-tight mb-6 leading-tight">${block.title}</h2>
                            <p class="text-xl text-apple-subtext dark:text-apple-darkSubtext leading-relaxed font-normal">${block.summary}</p>
                        </div>
                    `;
                } else if (block.type === 'split_feature' || block.type === 'split_feature_reverse') {
                    const isRev = block.type === 'split_feature_reverse';
                    html += `
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center py-6">
                            <div class="${isRev ? 'lg:order-2' : ''}">
                                <h3 class="text-2xl font-semibold tracking-tight mb-4">${block.title}</h3>
                                <p class="text-base text-apple-subtext dark:text-apple-darkSubtext leading-relaxed">${block.body}</p>
                            </div>
                            <div class="${isRev ? 'lg:order-1' : ''} rounded-3xl overflow-hidden bg-apple-bg dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder cursor-pointer shadow-md" onclick="openLightbox('${block.image}')">
                                <img src="${block.image}" alt="${block.title}" class="w-full h-auto object-cover hover:scale-105 transition-transform duration-500">
                            </div>
                        </div>
                    `;
                } else if (block.type === 'image_grid_2') {
                    html += `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 py-4">
                            ${block.images.map(img => `
                                <div class="rounded-3xl overflow-hidden bg-apple-bg dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder cursor-pointer shadow-sm group" onclick="openLightbox('${img.url}')">
                                    <div class="aspect-[4/3] overflow-hidden"><img src="${img.url}" alt="${img.caption}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>
                                    <div class="p-4 text-xs font-medium text-apple-subtext dark:text-apple-darkSubtext text-center">${img.caption}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (block.type === 'image_grid_3') {
                    html += `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 py-4">
                            ${block.images.map(img => `
                                <div class="rounded-3xl overflow-hidden bg-apple-bg dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder cursor-pointer shadow-sm group" onclick="openLightbox('${img.url}')">
                                    <div class="aspect-[4/3] overflow-hidden"><img src="${img.url}" alt="${img.caption}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>
                                    <div class="p-4 text-xs font-medium text-apple-subtext dark:text-apple-darkSubtext text-center">${img.caption}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (block.type === 'dual_theme') {
                    html += `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-8 rounded-3xl bg-white dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder my-8 shadow-sm">
                            <div class="space-y-3">
                                <h4 class="text-sm font-semibold uppercase tracking-wider text-apple-accent">Mallorca: Ocean & Light</h4>
                                <p class="text-sm text-apple-subtext dark:text-apple-darkSubtext leading-relaxed">${block.mallorcaText}</p>
                            </div>
                            <div class="space-y-3">
                                <h4 class="text-sm font-semibold uppercase tracking-wider text-apple-accent">Alps: Alpine Geometry</h4>
                                <p class="text-sm text-apple-subtext dark:text-apple-darkSubtext leading-relaxed">${block.alpsText}</p>
                            </div>
                        </div>
                    `;
                } else if (block.type === 'quote_banner') {
                    html += `
                        <div class="p-10 lg:p-16 rounded-3xl bg-apple-bg dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder my-8 text-center max-w-4xl mx-auto">
                            <p class="text-lg lg:text-2xl font-medium tracking-tight leading-relaxed">"${block.text}"</p>
                        </div>
                    `;
                } else if (block.type === 'bullet_list') {
                    html += `
                        <div class="max-w-3xl mx-auto py-6 space-y-6">
                            <h3 class="text-xl font-semibold tracking-tight">${block.title}</h3>
                            <ul class="space-y-3">
                                ${block.items.map(item => `<li class="flex items-start gap-3 text-base text-apple-subtext dark:text-apple-darkSubtext"><span class="text-apple-accent font-bold">•</span><span>${item}</span></li>`).join('')}
                            </ul>
                            <p class="text-base text-apple-subtext dark:text-apple-darkSubtext pt-4 leading-relaxed">${block.footer}</p>
                        </div>
                    `;
                } else if (block.type === 'text_block') {
                    html += `
                        <div class="max-w-3xl mx-auto py-6">
                            <p class="text-lg text-apple-subtext dark:text-apple-darkSubtext leading-relaxed">${block.text}</p>
                        </div>
                    `;
                } else if (block.type === 'next_project') {
                    html += `
                        <div class="mt-20 pt-16 border-t border-apple-border dark:border-apple-darkBorder">
                            <span class="text-xs uppercase tracking-widest text-apple-subtext dark:text-apple-darkSubtext font-semibold mb-6 block">${block.title}</span>
                            <a href="${block.link}" class="group block p-8 lg:p-12 rounded-3xl bg-white dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder shadow-sm hover:border-apple-accent transition-all">
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                                    <div>
                                        <h4 class="text-2xl font-semibold tracking-tight mb-3 group-hover:text-apple-accent transition-colors">${block.projectTitle}</h4>
                                        <p class="text-sm text-apple-subtext dark:text-apple-darkSubtext leading-relaxed">${block.projectDesc}</p>
                                    </div>
                                    <div class="rounded-2xl overflow-hidden aspect-video border border-apple-border dark:border-apple-darkBorder"><img src="${block.image}" alt="Next Project" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>
                                </div>
                            </a>
                        </div>
                    `;
                } else if (block.type === 'toolkit') {
                    html += `
                        <div class="py-12">
                            <h3 class="text-xl font-semibold tracking-tight mb-8">${block.heading}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                ${block.items.map(item => `
                                    <div class="p-6 rounded-2xl bg-white dark:bg-apple-darkCard border border-apple-border dark:border-apple-darkBorder shadow-sm">
                                        <h4 class="font-semibold mb-2">${item.title}</h4>
                                        <p class="text-xs text-apple-subtext dark:text-apple-darkSubtext leading-relaxed">${item.desc}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            html += `</div>`;
            return html;
        }

        // Lightbox Functions
        function openLightbox(imgSrc) {
            const modal = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxImg');
            img.src = imgSrc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLightbox() {
            const modal = document.getElementById('lightboxModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Micro-CMS Edit Mode Functions
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const indicator = document.getElementById('editModeIndicator');
            const dot = document.getElementById('editDot');
            const text = document.getElementById('editText');
            const dock = document.getElementById('studioDock');

            if (isEditMode) {
                indicator.classList.add('bg-apple-accent', 'text-white');
                dot.classList.remove('bg-apple-subtext');
                dot.classList.add('bg-white', 'animate-ping');
                text.innerText = 'Exit Studio Mode';
                dock.classList.remove('hidden');
                dock.classList.add('flex');
            } else {
                indicator.classList.remove('bg-apple-accent', 'text-white');
                dot.classList.add('bg-apple-subtext');
                dot.classList.remove('bg-white', 'animate-ping');
                text.innerText = 'Studio Mode';
                dock.classList.remove('flex');
                dock.classList.add('hidden');
            }
            router();
        }

        function enableEditing() {
            document.querySelectorAll('h1, h2, h3, p').forEach(el => {
                if (!el.closest('header')) {
                    el.setAttribute('contenteditable', 'true');
                    el.classList.add('editable-active');
                }
            });
        }

        function updatePageProp(pageKey, prop, val) {
            pages[pageKey][prop] = val;
            savePages();
        }

        function updateBlockProp(pageKey, blockIndex, prop, val) {
            pages[pageKey].blocks[blockIndex][prop] = val;
            savePages();
        }

        function savePages() {
            localStorage.setItem('tk_creative_pages', JSON.stringify(pages));
        }

        function moveBlock(pageKey, index, direction) {
            const blocks = pages[pageKey].blocks;
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < blocks.length) {
                const temp = blocks[index];
                blocks[index] = blocks[newIndex];
                blocks[newIndex] = temp;
                savePages();
                router();
            }
        }

        function deleteBlock(pageKey, index) {
            if (confirm('Delete this section block?')) {
                pages[pageKey].blocks.splice(index, 1);
                savePages();
                router();
            }
        }

        function addBlockPrompt() {
            const type = prompt("Enter block type to add (hero, bento, split_feature, text_block, quote_banner):", "text_block");
            const hash = window.location.hash.slice(2) || 'home';
            if (!pages[hash]) return;

            let newBlock = { type: type };
            if (type === 'hero') {
                newBlock = { type: 'hero', tag: 'New Section', heading: 'New Headline Here', body: 'Add your descriptive body text here.', ctaText: 'Learn More', ctaLink: '#/home' };
            } else if (type === 'text_block') {
                newBlock = { type: 'text_block', text: 'Enter your editorial or narrative paragraph text here.' };
            } else if (type === 'quote_banner') {
                newBlock = { type: 'quote_banner', text: 'Enter a notable quote or brand statement here.' };
            } else if (type === 'split_feature') {
                newBlock = { type: 'split_feature', title: 'Feature Title', body: 'Feature description text...', image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop' };
            } else {
                newBlock = { type: 'bento', cards: [{ title: 'New Card', category: 'Category', desc: 'Description', link: '#/home', badge: 'New', image: '' }] };
            }

            pages[hash].blocks.push(newBlock);
            savePages();
            router();
        }

        function editLinkPrompt(pageKey, blockIndex, prop) {
            const current = pages[pageKey].blocks[blockIndex][prop] || '#/home';
            const target = prompt("Enter destination link (e.g., #/speexx-annual-kick-off-visual or https://...):", current);
            if (target) {
                pages[pageKey].blocks[blockIndex][prop] = target;
                savePages();
                router();
            }
        }

        function editCardLinkPrompt(pageKey, blockIndex, cardIndex) {
            const current = pages[pageKey].blocks[blockIndex].cards[cardIndex].link || '#/home';
            const target = prompt("Enter destination link for card:", current);
            if (target) {
                pages[pageKey].blocks[blockIndex].cards[cardIndex].link = target;
                savePages();
                router();
            }
        }

        // Site Map & Page Management
        function openSiteMap() {
            const modal = document.getElementById('siteMapModal');
            const list = document.getElementById('siteMapList');
            list.innerHTML = '';

            Object.keys(pages).forEach(key => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-4 rounded-2xl bg-apple-bg dark:bg-black/20 border border-apple-border dark:border-apple-darkBorder">
                        <div>
                            <h4 class="font-semibold text-sm">#/${key}</h4>
                            <p class="text-xs text-apple-subtext dark:text-apple-darkSubtext">${pages[key].title}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="#/${key}" onclick="closeSiteMap()" class="px-3 py-1.5 bg-white dark:bg-apple-darkCard rounded-xl text-xs font-medium border border-apple-border dark:border-apple-darkBorder">Visit</a>
                            ${key !== 'home' ? `<button onclick="deletePage('${key}'); openSiteMap();" class="px-3 py-1.5 bg-red-500/10 text-red-500 rounded-xl text-xs font-medium">Delete</button>` : ''}
                        </div>
                    </div>
                `;
            });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeSiteMap() {
            const modal = document.getElementById('siteMapModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function createNewPagePrompt() {
            const slug = prompt("Enter clean URL slug for new page (e.g. 'case-study-two'):");
            if (!slug) return;
            const cleanSlug = slug.toLowerCase().replace(/[^a-z0-9-]/g, '-');
            const title = prompt("Enter Page Title:", "New Creative Project");

            pages[cleanSlug] = {
                title: title + " — TK Creative",
                subtitle: "Studio case study and project overview.",
                blocks: [
                    {
                        type: 'editorial_header',
                        client: 'Client Name',
                        discipline: 'Brand Strategy & Design',
                        year: '2026',
                        title: title,
                        summary: 'Overview and narrative summary of the creative engagement.'
                    }
                ]
            };
            savePages();
            openSiteMap();
        }

        function deletePage(pageKey) {
            if (pageKey === 'home') {
                alert("Cannot delete the homepage.");
                return;
            }
            if (confirm(`Are you sure you want to delete page #/${pageKey}?`)) {
                delete pages[pageKey];
                savePages();
                window.location.hash = '#/home';
                router();
            }
        }

        // Export Clean Production HTML (Strips CMS chrome)
        function exportHTML() {
            let htmlContent = document.documentElement.outerHTML;
            // Strip edit mode and script handlers for clean production
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
